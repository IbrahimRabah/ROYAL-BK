# ROYAL IRON - nginx in front of the Angular SSR server and the Spring API.
#
# Not tested on a live server yet: replace the three CHANGE_ME values, run `nginx -t`, then reload.
#
#   Browser -> nginx (443) -+-> /api/      -> Spring API   127.0.0.1:8081
#                           +-> /uploads/  -> files on disk (long cache)
#                           +-> /          -> Angular SSR  127.0.0.1:4000  (node dist/velora/server/server.mjs)
#
# What this changes for the business: nothing. It only makes the same pages smaller and faster.
# The one trade-off is the short API cache below: a public page can lag the database by up to 15 seconds.
# Checkout, the cart, accounts and admin are never cached, so prices and stock at checkout are always exact.

# ---- 15-second cache for public reads (product list/detail, categories, filters, active sales and announcements)
proxy_cache_path /var/cache/nginx/royal_api levels=1:2 keys_zone=royal_api:10m max_size=200m inactive=10m use_temp_path=off;

# Only these paths are cacheable. Everything else goes straight to the API.
map $uri $royal_cacheable {
    default                                0;
    ~^/api/v1/products(/|$)                1;
    ~^/api/v1/categories(/|$)              1;
    ~^/api/v1/promotions/active$           1;
    ~^/api/v1/announcements/active$        1;
}

# Cache only when the path is cacheable (1), the request is a GET/HEAD, and it carries no sign-in token and no
# guest-cart token (those would be somebody's own data). The value is "1" + token + token + method, so only
# "1GET" / "1HEAD" is cacheable. 1 = skip the cache, 0 = use it.
map "$royal_cacheable$http_authorization$http_x_guest_token$request_method" $royal_skip_cache {
    default      1;
    "1GET"       0;
    "1HEAD"      0;
}

upstream royal_api { server 127.0.0.1:8081; keepalive 16; }
upstream royal_web { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    server_name CHANGE_ME.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name CHANGE_ME.example.com;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;

    client_max_body_size 12m;   # the API accepts up to 10 MB per request (5 MB per file)

    # ---- compression: nginx compresses; the API is asked for plain text so nothing is compressed twice.
    # (Brotli needs the ngx_brotli module; Cloudflare adds Brotli for you if you use it.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/problem+json text/plain text/css text/xml application/xml
               application/javascript text/javascript image/svg+xml;

    # ---- uploaded images: served from disk, cached for 30 days (the file names are random, so they never change)
    location ^~ /uploads/ {
        alias /var/www/royal-uploads/;   # CHANGE_ME: the real folder on the server (app.storage.local-path in application.yml)
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- the API
    location ^~ /api/ {
        proxy_pass http://royal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";      # ask for uncompressed; nginx compresses above
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache            royal_api;
        proxy_cache_key        "$scheme$host$request_uri$http_accept_language";
        proxy_cache_valid      200 15s;
        proxy_cache_lock       on;                 # one request refreshes, the rest wait: no stampede
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_bypass     $royal_skip_cache;
        proxy_no_cache         $royal_skip_cache;
        # The API says no-store; nginx must be told to cache the cacheable paths anyway.
        proxy_ignore_headers   Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;

        proxy_read_timeout 60s;
    }

    # ---- the website (Angular server-side rendering)
    location / {
        proxy_pass http://royal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS carry a hash in their name, so they can be cached for a year.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        proxy_pass http://royal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
