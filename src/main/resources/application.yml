spring:
  application:
    name: royal-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=royal;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null

  # Gmail SMTP, 500 messages/day free — enough to start. MAIL_USERNAME is the
  # Gmail address; MAIL_PASSWORD is a 16-character Gmail App Password, not the
  # account password (Google account settings -> Security -> App passwords —
  # requires 2-Step Verification to be on).
  # Both default to empty so a dev box without Gmail credentials still boots —
  # MailService.sendHtml() catches and logs a send failure rather than
  # propagating it, so checkout is never blocked by a missing/invalid mail setup.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

server:
  port: 8081
  error:
    include-message: always

management:
  health:
    # A Gmail outage or missing credentials must not fail liveness/readiness —
    # MailService already swallows send failures rather than blocking checkout,
    # so the health indicator agreeing with that is the actual contract.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

velora:
  storage:
    local-path: D:/ibrahim_watches/royal-uploads
    public-url-prefix: http://localhost:8081/uploads
    max-file-size-bytes: 5242880
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 30
  guest-token:
    # Falls back to JWT_SECRET so this does not become a second mandatory env var —
    # set GUEST_TOKEN_SECRET explicitly to use a separate key.
    secret: ${GUEST_TOKEN_SECRET:${JWT_SECRET}}
    # Transition switch: accept old, unsigned X-Guest-Token values (logged at WARN)
    # instead of rejecting every cart created before signing existed. Flip to false
    # once enough time has passed that no legitimate legacy cart is still in use.
    accept-legacy-unsigned: true
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*,http://192.168.*:*
  rate-limit:
    login:
      # Two independent checks, both must pass. Per-IP catches one attacker
      # spraying many accounts; per-account catches credential stuffing against
      # one target that rotates IPs to dodge the first check.
      max-per-ip: 10
      max-per-account: 5
      window-minutes: 15
    otp-send:
      # The per-destination cap (5/hour) already lived in OtpService — this adds
      # the per-IP half, so one machine cannot request codes for many different
      # numbers/emails in a row.
      max-per-ip: 10
      window-minutes: 60
  business:
    reservation-ttl-minutes: 20
    default-tax-rate: 0.14
    prices-include-tax: true